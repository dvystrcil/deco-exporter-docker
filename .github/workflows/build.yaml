# Image build pipeline for deco-exporter (homelab#1931).
#
# Mirrors nscale-calc-docker / kroger-mcp-docker: in-cluster ARC runner,
# Infisical for Harbor + CICD App credentials, push :dev, then
# release-action cuts a patch-bump release and docker-release.yaml retags
# :dev as :X.Y.Z (no `v` on image tags).
#
# Prerequisite: the `deco-exporter-docker-runner` ARC scale set in
# dvystrcil/argocd-projects:arc/arc-build-runners.yaml.

name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
  pull_request:
  workflow_dispatch:

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai
  IMAGE_NAME: deco-exporter

jobs:
  # Build the image and run it before pushing anything: a green
  # `docker build` says nothing about whether the entrypoint imports or the
  # exporter reports a dead router honestly. Asserts on real /metrics output.
  # Needs no secret or cluster access, so it runs on a GitHub-hosted runner
  # (homelab#2377); `build` below stays on the ARC runner.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image locally
        run: docker build -t deco-exporter:ci .

      - name: Smoke-test the built image
        run: bin/smoke-test.sh deco-exporter:ci | tee smoke.out

      # The script prints SMOKE-COMPLETE only as its last line; a crash that
      # still exits 0 would not reach it.
      - name: Assert the smoke test completed
        run: grep -qx 'SMOKE-COMPLETE' smoke.out

  # Runs on PRs too, so the required `build` check is a real gate: a skipped
  # required check counts as passing (homelab#2355). A PR builds the image
  # but fetches no secret, logs in nowhere, pushes nothing and cuts no
  # release; those steps are gated on the event below.
  build:
    needs: smoke
    runs-on: deco-exporter-docker-runner
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Fetch secrets from Infisical
        if: github.event_name != 'pull_request'
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Log in to Harbor (internal)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: actions/create-github-app-token@v3
        id: app-token
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build + push (dev image)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # A PR proves the image builds; it publishes nothing, and does not
          # touch the Harbor cache (it holds no Harbor credentials).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/{2}:buildcache', env.INTERNAL_REGISTRY, env.PROJECT, env.IMAGE_NAME) || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/{2}:buildcache,mode=max', env.INTERNAL_REGISTRY, env.PROJECT, env.IMAGE_NAME) || '' }}

      - name: Create GitHub release
        # Never from a PR.
        if: github.event_name != 'pull_request'
        # Patch++ off the latest release; publishing fires docker-release.yaml.
        uses: dvystrcil/release-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
